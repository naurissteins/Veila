halign = "left"
valign = "top"
x = 92
y = 12
relative_to = "weather"

[visuals.weather.location]
font_size = 18
font_family = "Google Sans Flex"
font_weight = 400
color = "rgba(255, 255, 255, 0.7)"
halign = "left"
valign = "bottom"
x = 92
y = -12
relative_to = "weather"

[visuals.now_playing]
enabled = true
fade_duration_ms = 320

[visuals.now_playing.artwork]
size = 52
radius = 10
opacity = 100
halign = "left"
valign = "center"
x = 14
y = 0
relative_to = "now_playing"

[visuals.now_playing.artist]
width = 370
color = "rgba(255, 255, 255, 0.5)"
font_family = "Google Sans Flex"
font_size = 15
font_weight = 400
halign = "left"
valign = "top"
x = 82
y = 17
relative_to = "now_playing"

[visuals.now_playing.title]
width = 370
color = "rgba(255, 255, 255, 0.9)"
font_family = "Google Sans Flex"
font_size = 17
font_weight = 400
halign = "left"
valign = "bottom"
x = 82
y = -17
relative_to = "now_playing"

# Invisible anchor that centers the stacked clock and date
[[visuals.backdrop]]
enabled = true
name = "clock_column"
mode = "solid"
color = "rgba(0, 0, 0, 0)"
width = 600
height = 640
halign = "left"
valign = "center"
x = 170
y = -60
z = 0

