y = 21

[visuals.power.reboot]
enabled = true
background_size = 46
radius = 23
background_color = "rgba(255, 255, 255, 0.07)"
color = "rgba(255, 255, 255, 0.85)"
size = 20
confirm = true
halign = "right"
valign = "top"
x = -186
y = 21

[visuals.power.suspend]
enabled = true
background_size = 46
radius = 23
