[background]
mode = "layered"
# path = "/path/to/wallpaper.jpg"
color = "#0B0D1A"
dim_strength = 0

[background.layered.base]
mode = "gradient"

[background.layered.base.gradient]
top_left = "#0D1230"
top_right = "#1E1A4A"
bottom_left = "#0A1A1E"
bottom_right = "#24121F"

[[background.layered.blobs]]
color = "#6A4CE0"
opacity = 55
x = 72
y = 22
size = 48

[[background.layered.blobs]]
color = "#E0506A"
opacity = 45
x = 92
y = 92
size = 34

[[background.layered.blobs]]
color = "#1FA58A"
opacity = 40
x = 12
y = 96
size = 32

[battery]
enabled = true

[weather]
enabled = false

[visuals.clock]
format = "24h"
style = "stacked"
font_family = "Geom"
font_weight = 600
color = "rgba(240, 240, 245, 0.95)"
font_size = 330
halign = "center"
valign = "top"
x = 0
y = -55
relative_to = "clock_column"

[visuals.date]
format = "long"
font_family = "Google Sans Flex"
font_weight = 400
font_size = 26
color = "rgba(255, 255, 255, 0.7)"
halign = "center"
valign = "bottom"
x = 0
y = -20
relative_to = "clock_column"

[visuals.avatar]
# image_path = "/path/to/avatar.jpg"
size = 150
background_color = "rgba(255, 255, 255, 0.12)"
placeholder_padding = 34
ring_color = "#FF6F8A"
ring_width = 4
icon_color = "#ffffff"
halign = "center"
valign = "top"
x = 0
y = 65
relative_to = "auth_glass"

[visuals.username]
enabled = true
font_family = "Google Sans Flex"
font_weight = 400
color = "rgba(255, 255, 255, 0.95)"
font_size = 32
halign = "center"
valign = "top"
x = 0
y = 245
relative_to = "auth_glass"

[visuals.input]
placeholder = "Password"
background_color = "rgba(255, 255, 255, 0.08)"
border_color = "rgba(255, 255, 255, 0.25)"
border_width = 2
width = 330
height = 58
radius = 29
mask_color = "#ffffff"
font_family = "Google Sans Flex"
font_weight = 400
font_size = 17
halign = "center"
valign = "center"
x = 0
y = 140
relative_to = "auth_glass"

[visuals.status]
mode = "inline"
rejected_color = "#FF9AAA"
pending_color = "#ECECEC"

[visuals.eye]
color = "rgba(255, 255, 255, 0.8)"

[visuals.caps_lock]
color = "rgba(255, 255, 255, 0.52)"

[visuals.placeholder]
color = "rgba(255, 255, 255, 0.85)"

[visuals.keyboard]
background_size = 46
radius = 23
background_color = "rgba(255, 255, 255, 0.07)"
color = "rgba(255, 255, 255, 0.85)"
size = 16
halign = "right"
valign = "top"
x = -24
y = 21

[visuals.battery]
background_size = 46
radius = 23
background_color = "rgba(255, 255, 255, 0.07)"
color = "rgba(255, 255, 255, 0.85)"
size = 20
halign = "right"
valign = "top"
x = -78
y = 21

