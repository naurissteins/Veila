[background]
mode = "file"
path = "/path/to/wallpaper.jpg"
color = "#6EC6F2"
dim_strength = 0

[battery]
enabled = true

[weather]
enabled = false

[visuals.clock]
format = "12h"
style = "standard"
meridiem_font_size = 22
meridiem_x = 8
meridiem_y = 22
font_family = "Geom"
font_weight = 600
color = "#0E5876"
font_size = 112
halign = "center"
valign = "top"
x = 0
y = 322
relative_to = "auth_pill"

[visuals.date]
format = "long"
font_family = "Google Sans Flex"
font_weight = 400
font_size = 22
color = "#2F6F86"
halign = "center"
valign = "top"
x = 0
y = 464
relative_to = "auth_pill"

[visuals.avatar]
# image_path = "/path/to/avatar.jpg"
size = 150
background_color = "rgba(255, 255, 255, 0.35)"
placeholder_padding = 34
ring_color = "rgba(255, 255, 255, 0.85)"
ring_width = 3
icon_color = "#0F5E78"
halign = "center"
valign = "top"
x = 0
y = 60
relative_to = "auth_pill"

[visuals.username]
enabled = true
font_family = "Google Sans Flex"
font_weight = 400
color = "#0F4C66"
font_size = 26
halign = "center"
valign = "top"
x = 0
y = 230
relative_to = "auth_pill"

[visuals.input]
