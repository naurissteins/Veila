width = 330
height = 58
radius = 29
mask_color = "#0E5876"
font_family = "Google Sans Flex"
font_weight = 400
font_size = 17
halign = "center"
valign = "bottom"
x = 0
y = -122
relative_to = "auth_pill"

[visuals.status]
mode = "inline"
rejected_color = "#C8324A"
pending_color = "#0E5876"

[visuals.eye]
color = "#0E5876"

[visuals.caps_lock]
color = "#D48A1E"

[visuals.placeholder]
color = "rgba(14, 76, 102, 0.75)"

[visuals.keyboard]
