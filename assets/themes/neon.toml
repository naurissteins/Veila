[background]
mode = "layered"
# path = "/path/to/wallpaper.jpg"
color = "#0A0618"
dim_strength = 0

[background.layered.base]
mode = "gradient"

[background.layered.base.gradient]
top_left = "#07061A"
top_right = "#0B0720"
bottom_left = "#3A0F42"
bottom_right = "#2C0B38"

[[background.layered.blobs]]
color = "#FF4FA0"
opacity = 30
x = 50
y = 78
size = 48

[[background.layered.blobs]]
