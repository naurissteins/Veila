[package]
name = "veila"
description = "Secure, elegant, and fast Wayland screen locker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
veila-session = { path = "crates/session" }
veila-auth = { path = "crates/auth" }
veila-curtain = { path = "crates/curtain" }
veila-renderer = { path = "crates/renderer" }
veila-cli = { path = "crates/cli" }
anyhow = { workspace = true }
nix = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[workspace]
resolver = "2"
members = [
    "crates/session",
    "crates/auth",
    "crates/common",
    "crates/curtain",
    "crates/cli",
    "crates/renderer",
    "crates/ui",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.89"
authors = ["Nauris Steins"]
license = "GPL-3.0-or-later"
repository = "https://github.com/naurissteins/Veila"

[workspace.dependencies]
anyhow = "1"
calloop = { version = "0.14", features = ["signals"] }
cosmic-text = "0.19"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }
memmap2 = "0.9"
nix = { version = "0.31", features = [
    "fs",
    "poll",
    "process",
    "signal",
    "socket",
    "user",
] }
nonstick = "0.1"
resvg = { version = "0.47", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = { version = "0.20", default-features = false, features = [
    "calloop",
    "xkbcommon",
] }
sys-locale = "0.3"
thiserror = "2"
time = { version = "0.3", features = ["local-offset"] }
tiny-skia = "0.12"
tokio = { version = "1.54.1", features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "signal",
    "sync",
    "time",
] }
toml = "1"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", default-features = true, features = ["json"] }
wayland-protocols-wlr = "0.3"
xkbcommon = "0.9"
zeroize = "1"
zbus = { version = "6.1", default-features = false, features = [
    "tokio",
    "proxy",
    "tracing",
] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
